<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiron Vervoerbewijs</title>
  <style>
    * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background-color: #f4f4f9; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    
    /* شاشة القفل */
    #lock-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1e1e2f; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999; color: white;
    }
    #lock-screen input {
      padding: 12px; font-size: 18px; text-align: center; border-radius: 8px;
      border: 1px solid #444; margin: 15px 0; width: 220px; outline: none;
    }
    #lock-screen button {
      padding: 12px 30px; background: #28a745; color: white; border: none;
      border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    /* تصميم الفاتورة 80mm */
    .receipt {
      width: 80mm; background: white; padding: 10px; border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px;
    }
    .header { text-align: center; font-weight: bold; border-bottom: 1px dashed #000; padding-bottom: 5px; }
    .line { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
    .footer { text-align: center; border-top: 1px dashed #000; padding-top: 5px; font-size: 11px; margin-top: 10px; }
    .btn-print {
      width: 80mm; padding: 12px; background: #007bff; color: white; border: none;
      font-size: 16px; border-radius: 5px; font-weight: bold; cursor: pointer;
    }

    @media print {
      body { background: white; padding: 0; }
      #lock-screen, .btn-print { display: none !important; }
      .receipt { border: none; box-shadow: none; width: 100%; }
      @page { size: 80mm auto; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- شاشة كلمة المرور -->
  <div id="lock-screen">
    <h2>🔒 النظام محمي</h2>
    <p>أدخل كلمة المرور للمتابعة:</p>
    <input type="password" id="pass-input" placeholder="****">
    <button onclick="checkPassword()">دخول</button>
    <p id="error-msg" style="color: #ff6b6b; display: none; margin-top: 10px;">كلمة المرور خاطئة!</p>
  </div>

  <!-- واجهة الفاتورة -->
  <div class="receipt">
    <div class="header">
      VERVOERBEWIJS CHIRON<br>
      <small>Taxi Service</small>
    </div>
    <div class="line" style="margin-top: 10px;"><span>Datum:</span><span id="cur-date"></span></div>
    <div class="line"><span>Rit ID:</span><span>#CH-8921</span></div>
    <hr style="border: 0; border-top: 1px dashed #000;">
    <div class="line"><span>Start:</span><span>Brussels Center</span></div>
    <div class="line"><span>Bestemming:</span><span>Zaventem Airport</span></div>
    <div class="line"><span>Afstand:</span><span>14.5 km</span></div>
    <hr style="border: 0; border-top: 1px dashed #000;">
    <div class="line" style="font-weight: bold; font-size: 14px;"><span>TOTAAL:</span><span>€ 38.50</span></div>
    <div class="footer">
      Bedankt voor uw rit!<br>
      Chiron Digital System
    </div>
  </div>

  <button class="btn-print" onclick="window.print()">طباعة الفاتورة 🖨️</button>

  <script>
    document.getElementById('cur-date').innerText = new Date().toLocaleDateString('nl-BE');

    // كلمة المرور المعتمدة
    const SECRET_PASS = "ram12345";

    function checkPassword() {
      const input = document.getElementById('pass-input').value;
      if (input === SECRET_PASS) {
        document.getElementById('lock-screen').style.display = 'none';
        sessionStorage.setItem('authenticated', 'true');
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // السماح بالضغط على زر Enter للدخول
    document.getElementById('pass-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    // حفظ حالة الدخول طالما التبويب مفتوح
    if (sessionStorage.getItem('authenticated') === 'true') {
      document.getElementById('lock-screen').style.display = 'none';
    }
  </script>
</body>
</html>
