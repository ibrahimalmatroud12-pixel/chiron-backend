<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiron - Acceptatietest & Facturatie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      direction: ltr;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #2c3e50;
      margin-top: 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #5b4bc4;
    }
    #response {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      background: #eef2f7;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Chiron Acceptatietest - Ritgegevens</h2>
    <p>Klik op de onderstaande knop om de testgegevens naar de Render-server te verzenden.</p>

    <button class="btn" onclick="sendTestRequest()">Verzend Rit naar Server</button>

    <div id="response">Status: Wachten op actie...</div>
  </div>

  <script>
    async function sendTestRequest() {
      const responseDiv = document.getElementById('response');
      responseDiv.innerText = "Verzenden...";

      const testData = {
        ritId: "RIT-" + Math.floor(Math.random() * 100000),
        datum: new Date().toISOString(),
        vertrek: "Brussel",
        bestemming: "Antwerpen",
        bedrag: 45.50,
        status: "TEST_ACCEPTATIE"
      };

      try {
        const res = await fetch("https://chiron-backend.onrender.com/chiron/verzoek", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(testData)
        });

        const data = await res.json();
        
        if (res.ok) {
          alert("تم الاتصال بالسيرفر بنجاح!");
          responseDiv.innerText = "Succesvol verzonden:\n" + JSON.stringify(data, null, 2);
        } else {
          responseDiv.innerText = "Fout bij verzenden:\n" + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        alert("حدث خطأ في الاتصال بالأوفلاين أو بالسيرفر");
        responseDiv.innerText = "Netwerkfout: " + err.message;
      }
    }
  </script>

</body>
</html>
